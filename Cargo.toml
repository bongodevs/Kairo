[package]
name = "kairo"
version = "4.8.7"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Standalone Discord audio sending node, written in Rust. Drop-in Lavalink v4 compatible."

[dependencies]
bytes = "1"
futures-util = "0.3"
libc = "0.2"
perf_monitor = "0.2.1"
rand = "0.8"
semver = "1"
serde_json = "1"
toml = "0.8"
tower-service = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
http-body-util = "0.1"

[dependencies.lyrics]
git = "https://github.com/bongodevs/lyrics"
tag = "v0.2.11"

[dependencies.player]
git = "https://github.com/bongodevs/player"
branch = "remote-yt"

[dependencies.sources]
git = "https://github.com/bongodevs/sources"
branch = "remote-yt"

[dependencies.voice]
git = "https://github.com/bongodevs/voice"
rev = "5210ca70c28388bec04900c39e5a21e4b83b39ea"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "json"]

[dependencies.mimalloc]
version = "0.1.48"
features = ["v3"]

[dependencies.tokio]
version = "1.53"
features = ["tracing", "macros", "signal", "rt-multi-thread"]

[dependencies.axum]
version = "0.8"
default-features = true
features = ["ws", "http2"]

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["clock"]

[dependencies.hyper]
version = "1"
features = ["server", "http1", "http2"]

[dependencies.hyper-util]
version = "0.1"
features = ["server-auto", "tokio"]

[dependencies.libmimalloc-sys]
version = "=0.1.44"
features = ["extended"]

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter", "json", "chrono"]

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
overflow-checks = false

# Use the checkout in this workspace while the remote-resolver work is in flight.
[patch."https://github.com/bongodevs/sources"]
sources = { path = "crates/sources" }
